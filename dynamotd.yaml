# This is a configuration file example.
# It is completely optional. The values below represent the defaults.

# empty line is an empty line, duh
# some row types have settings, f.e. to change the thresholds of when they are shown in yellow or red:
#   - memory:
#       warning: 80
#       critical: 90
# to show the output of a custom command:
#   - command:
#       label: Containers
#       run: docker ps -q | wc -l
# see the README for all the row types and their settings
rows:
  - timestamp
  - clock
  -
  - fqdn
  - ip
  - uptime
  - reboot
  -
  - users
  -
  - load
  - cpu
  - topprocesses
  - memory
  - diskspace
  -
  - failedunits

# rows that don't finish within this time are shown as "timed out",
# so that f.e. a broken DNS doesn't block your login
timeout: 1s
